name: Module checks

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  java:
    name: Java 21 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build, validate metadata, run JUnit and packaged consumers
        run: bash ./gradlew build
      - name: Upload Java test reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: java-reports-${{ matrix.os }}
          path: |
            build/reports/tests/
            build/test-results/test/
      - name: Upload tested distribution
        uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-24.04'
        with:
          name: bx-jruby-distribution
          path: |
            build/distributions/*.zip
            build/distributions/*.zip.sha256
          if-no-files-found: error

  boxlang:
    name: BoxLang ${{ matrix.boxlang-version }}
    needs: java
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        boxlang-version: ['1.18.0', latest, snapshot]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up BoxLang and CommandBox
        uses: ortus-boxlang/setup-boxlang@main
        with:
          version: ${{ matrix.boxlang-version }}
          with-commandbox: true
      - name: Download tested distribution
        uses: actions/download-artifact@v8
        with:
          name: bx-jruby-distribution
          path: build/distributions
      - name: Install development dependencies
        run: box install
      - name: Verify checksum and install ZIP in isolated consumer
        run: |
          version="$(jq -er '.version' box.json)"
          (cd build/distributions && sha256sum --check "bx-jruby-$version.zip.sha256")
          box install "ID=build/distributions/bx-jruby-$version.zip" \
            directory=build/consumer/modules production=true save=false
          test -f build/consumer/modules/bx-jruby/ModuleConfig.bx
      - name: Verify installed consumer and module setting overrides
        run: |
          boxlang --bx-home build/consumer/home --bx-config src/test/bx/consumer/boxlang.json src/test/bx/consumer/Smoke.bxm
          boxlang --bx-home build/consumer-override/home --bx-config src/test/bx/consumer/boxlang.override.json src/test/bx/consumer/Overrides.bxs
      - name: Run TestBox and verify report totals
        run: |
          boxlang --bx-home build/consumer/home --bx-config src/test/bx/consumer/boxlang.json \
            testbox/system/runners/BoxLangRunner.bx --directory=src.test.bx.specs --stream \
            --write-report=true --write-json-report=true \
            --reportpath="$GITHUB_WORKSPACE/build/testbox" --properties-summary=false --stacktrace=short
          # TestBox can exit zero despite failed specs; check the actual report.
          jq -e '.totalFail == 0 and .totalError == 0 and .totalPass > 0' build/testbox/report.json
      - name: Upload TestBox reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: testbox-${{ matrix.boxlang-version }}
          path: build/testbox/
